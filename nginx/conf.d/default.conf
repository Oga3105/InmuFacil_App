server {
    listen 80;
    server_name inmufacil.com www.inmufacil.com 87.106.247.84;

    # Header global: bloquear indexacion en todos los endpoints
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # --- Flutter Web en /TFM ---
    location /TFM {
        alias /usr/share/nginx/html;
        index index.html;
        # Necesario para que GoRouter funcione con URLs directas
        try_files $uri $uri/ /TFM/index.html;
    }

    # Redirigir /TFM sin barra final para evitar 301 doble
    location = /TFM {
        return 301 /TFM/;
    }

    # --- Proxy al backend FastAPI ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # --- Proxy al Swagger UI y /health (utiles para debug) ---
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # --- robots.txt servido desde el build de Flutter ---
    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }

    # --- Raiz y cualquier otra ruta: 404 estricto ---
    location / {
        return 404 "Not found";
        add_header Content-Type text/plain;
    }

    # --- Ocultar version de Nginx en errores ---
    server_tokens off;
}
