server {
    listen 80;
    server_name inmufacil.com www.inmufacil.com 87.106.247.84;

    # --- Ocultar version de Nginx ---
    server_tokens off;

    # --- Security headers globales (aplican a todas las rutas) ---
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS: fuerza HTTPS durante 1 ano (Cloudflare gestiona TLS; este header
    # llega al cliente via Cloudflare cuando la conexion cliente-CF es HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: politica base valida para la app Flutter compilada (no ejecuta JS
    # inline propio; cdn.jsdelivr.net es necesario para Swagger UI en /docs)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://inmufacil.com https://api.inmufacil.com wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Flutter Web en /TFM ---
    location /TFM/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /TFM/index.html;
        include /etc/nginx/mime.types;
    }

    location = /TFM {
        return 301 /TFM/;
    }

    # --- Proxy al backend FastAPI ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # --- Proxy al Swagger UI y /health (utiles para debug) ---
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # --- robots.txt servido desde el build de Flutter ---
    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    }

    # --- security.txt (RFC 9116) ---
    location = /.well-known/security.txt {
        alias /usr/share/nginx/html/.well-known/security.txt;
        add_header Content-Type text/plain;
    }

    # --- Raiz y cualquier otra ruta: 404 estricto ---
    location / {
        return 404 "Not found";
        add_header Content-Type text/plain;
    }
}
