version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: inmufacil_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/inmufacil/data/db:/var/lib/postgresql/data
    networks:
      - inmufacil_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inmufacil_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inmufacil_net
    expose:
      - "8000"
    volumes:
      - /opt/inmufacil/uploads:/app/uploads

  proxy:
    image: nginx:1.25-alpine
    container_name: inmufacil_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/inmufacil/nginx/conf.d:/etc/nginx/conf.d:ro
      - /opt/inmufacil/nginx/certs:/etc/nginx/certs:ro
      - /opt/inmufacil/frontend/build/web:/usr/share/nginx/html:ro
    networks:
      - inmufacil_net
    depends_on:
      - backend

networks:
  inmufacil_net:
    driver: bridge
