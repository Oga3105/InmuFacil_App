---
name: 🐛 Reporte de Bug
description: Reportar un error o comportamiento inesperado en InmuFácil
title: "[BUG]: "
labels: ["bug", "needs-triage"]
assignees:
  - Oga3105

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este bug. Por favor, completa la información a continuación para ayudarnos a resolverlo.

  - type: textarea
    id: description
    attributes:
      label: Descripción del Bug
      description: Descripción clara y concisa del problema
      placeholder: ¿Qué salió mal?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: Pasos detallados para reproducir el comportamiento
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Ver error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué esperabas que sucediera?
      placeholder: Describe el comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento Actual
      description: ¿Qué sucedió en su lugar?
      placeholder: Describe lo que realmente sucedió
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Componente Afectado
      description: ¿Qué parte del sistema está afectada?
      options:
        - Backend (API/FastAPI)
        - Frontend (Flutter)
        - Base de Datos
        - Autenticación
        - KYC/Vault
        - Propiedades
        - Ofertas
        - Visitas
        - Servicios
        - Otro
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      description: ¿Qué tan grave es este bug?
      options:
        - Crítico (bloquea funcionalidad principal)
        - Alto (funcionalidad importante afectada)
        - Medio (funcionalidad secundaria afectada)
        - Bajo (problema cosmético o menor)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Información sobre tu entorno
      placeholder: |
        - OS: [ej. Windows 11, Ubuntu 22.04]
        - Python: [ej. 3.10.5]
        - Flutter: [ej. 3.16.0]
        - Navegador: [ej. Chrome 120]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs/Errores
      description: Si aplica, pega logs o mensajes de error
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Capturas de Pantalla
      description: Si aplica, añade capturas de pantalla
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Seguridad
      description: ¿Este bug tiene implicaciones de seguridad?
      options:
        - label: Este bug podría tener implicaciones de seguridad
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Contexto Adicional
      description: Cualquier otra información relevante
    validations:
      required: false
