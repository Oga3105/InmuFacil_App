version: 2
updates:
  # 1. Backend Python (FUSIÓN: Grupos Inteligentes de Copilot + Config Base)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Grupos inteligentes para reducir ruido (De Copilot)
    groups:
      security-updates:
        patterns:
          - "cryptography"
          - "passlib"
          - "python-jose"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      core-framework:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "sqlalchemy"
        update-types:
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "Oga3105"
    assignees:
      - "Oga3105"

  # 2. Frontend Flutter (DE DEVELOP - CRÍTICO CONSERVARLO)
  - package-ecosystem: "pub"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "flutter"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "Oga3105"
    assignees:
      - "Oga3105"

  # 3. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"