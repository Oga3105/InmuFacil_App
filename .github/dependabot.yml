version: 2
updates:
  # Dependencias de Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    # Agrupar actualizaciones por tipo
    groups:
      security-updates:
        patterns:
          - "cryptography"
          - "passlib"
          - "python-jose"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      core-framework:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "sqlalchemy"
        update-types:
          - "patch"
    # Configuración de PRs
    open-pull-requests-limit: 10
    reviewers:
      - "Oga3105"
    assignees:
      - "Oga3105"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
