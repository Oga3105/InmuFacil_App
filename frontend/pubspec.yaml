name: inmufacil_frontend
description: InmuFácil - Plataforma P2P de Compraventa Inmobiliaria
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
   
  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  collection: ^1.18.0
   
  # Networking
  dio: ^5.9.2
   
  # Routing
  go_router: ^17.2.2
   
  # Environment Config
  flutter_dotenv: 6.0.0
   
  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Local Persistence (favoritos cache)
  shared_preferences: ^2.5.5
   
  # JSON Serialization
  json_annotation: ^4.9.0
   
  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
   
  # Internationalization (CRÍTICO: MANTENER)
  easy_localization: ^3.0.3
  intl: ^0.20.2
   
  # Maps Integration (CRÍTICO: MANTENER)
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  camera: ^0.12.0
  http: ^1.2.0

  # External URL launching
  url_launcher: ^6.3.0

  # Share (native share sheet + WhatsApp)
  share_plus: ^10.1.4

  # Real-time chat (WebSocket)
  web_socket_channel: ^3.0.1

  # Firebase — Phone verification (2FA for sensitive chat actions)
  # Requires google-services.json (Android) / GoogleService-Info.plist (iOS/macOS)
  # and firebase_options.dart generated by FlutterFire CLI.
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
   
  # Linting
  flutter_lints: ^6.0.0
   
  # Code Generation
  build_runner: ^2.13.1
  json_serializable: ^6.11.2
  
  # Testing
  mockito: ^5.6.4

flutter:
  uses-material-design: true
   
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - .env
    # - .env.development
    # - .env.production
   
