name: inmufacil_frontend
description: InmuFácil - Plataforma P2P de Compraventa Inmobiliaria
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
   
  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
   
  # Networking
  dio: ^5.2.1
   
  # Routing
  go_router: ^13.0.0
   
  # Environment Config
  flutter_dotenv: ^6.0.0
   
  # Secure Storage
  flutter_secure_storage: ^10.0.0
   
  # JSON Serialization
  json_annotation: ^4.9.0
   
  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
   
  # Internationalization (CRÍTICO: MANTENER)
  easy_localization: ^3.0.3
  intl: ^0.20.2
   
  # Maps Integration (CRÍTICO: MANTENER)
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  geocoding: ^2.1.1
  geolocator: ^14.0.2
  image_picker: ^1.0.7
  camera: ^0.11.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
   
  # Linting
  flutter_lints: ^6.0.0
   
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  
  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
   
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - .env
    # - .env.development
    # - .env.production
   
