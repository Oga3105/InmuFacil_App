version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inmufacil_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: inmufacil_user
      POSTGRES_PASSWORD: passwordSeguro123
      POSTGRES_DB: inmufacil_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmufacil_user -d inmufacil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
