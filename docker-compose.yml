version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inmufacil_postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: inmufacil_user
      POSTGRES_PASSWORD: passwordSeguro123
      POSTGRES_DB: inmufacil_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inmufacil_user -d inmufacil_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: inmufacil_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://inmufacil_user:passwordSeguro123@db:5432/inmufacil_db

volumes:
  postgres_data:
    driver: local
